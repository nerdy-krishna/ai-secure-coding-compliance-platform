worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Compression for the SPA bundles and every proxied text response.
    # Without this, Grafana's ~3.3 MB of JS is shipped uncompressed to a
    # browser that may be an ocean away (measured ~11 KB/s over WAN).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # `text/javascript` is what Grafana (and Vite) actually send; listing only
    # application/javascript silently disables gzip for every JS bundle.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml;

    # Allow large file uploads (ZIP archives, tarballs) for scan submission.
    client_max_body_size 500m;

    # Rate-limit zones referenced by server blocks (nginx-http.conf / nginx-https.conf)
    limit_req_zone $binary_remote_addr zone=spa_zone:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

    # WebSocket upgrade helper for the /grafana/ reverse proxy (Grafana Live,
    # live log tail). `Connection: upgrade` must only be sent when the client
    # actually asked for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
