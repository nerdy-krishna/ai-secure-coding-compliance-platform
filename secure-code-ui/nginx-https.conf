server {
    listen 80 default_server;
    server_name _;
    
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # HTTP/2 (nginx >= 1.25.1 syntax). The SPA and Grafana pages pull 10-20
    # asset requests each; over HTTP/1.1 a high-RTT client serialises them
    # across six connections and stalls, which is what made /grafana look
    # "not loading" even after gzip and buffering were fixed.
    http2 on;
    server_name _;

    # V15.3.4 — Trust only the local docker bridge for real-IP extraction
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;

    ssl_certificate /etc/letsencrypt/live/__SSL_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SSL_DOMAIN__/privkey.pem;

    # SSL Recommended Defaults
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp384r1;

    # V12.1.4 — OCSP stapling for efficient revocation checking
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/__SSL_DOMAIN__/chain.pem;

    root /usr/share/nginx/html;
    index index.html;

    # The Vite build emits content-hashed JS/CSS bundles plus a single
    # index.html that always references the latest hashes. If the
    # browser caches index.html, the user keeps loading the OLD
    # bundle even after a redeploy. Force every navigation to validate
    # against the server. Hashed assets stay cacheable for a year.
    location = / {
        limit_req zone=spa_zone burst=200 nodelay;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /index.html {
        limit_req zone=spa_zone burst=200 nodelay;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hashed JS/CSS/font/image bundles — immutable by content hash.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform" always;
    }

    location / {
        # V2.4.1 — rate-limit SPA; requires limit_req_zone $binary_remote_addr zone=spa_zone:10m rate=60r/s; in http{} (nginx.conf)
        limit_req zone=spa_zone burst=200 nodelay;
        try_files $uri $uri/ /index.html;
    }

    resolver 127.0.0.11 valid=30s;

    # Grafana lives under /grafana/ on this same host and certificate (no second
    # hostname, no port 3000 exposure). `^~` is required so the asset regex
    # above cannot hijack Grafana's own /grafana/public/*.js bundles, and the
    # upstream is a variable so nginx starts (and the SPA keeps serving) even
    # when the log_stack profile is not running.
    #
    # The split below is deliberate: `proxy_buffering off` on the whole prefix
    # made nginx dribble Grafana's ~3.3 MB of assets out in small chunks and the
    # login page never finished loading over a high-latency link. Static,
    # content-hashed bundles are buffered, gzipped and cached; only the Live
    # streaming endpoints stay unbuffered.
    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/public/ {
        set $grafana_static "http://grafana:3000";
        proxy_pass $grafana_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;

        # Cache headers: Grafana already sends `public, max-age=31536000` for
        # its content-hashed bundles. Do not add a second Cache-Control here -
        # overriding it made the browser re-download everything on every
        # navigation.
    }

    location ^~ /grafana/api/live/ {
        set $grafana_live "http://grafana:3000";
        proxy_pass $grafana_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /grafana/ {
        set $grafana "http://grafana:3000";
        proxy_pass $grafana;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Dashboard queries can outlast the default 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Grafana responses are user-specific; never let an intermediary cache.
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/ {
        # V2.4.1 — rate-limit API; requires limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s; in http{} (nginx.conf)
        limit_req zone=api_zone burst=60 nodelay;
        set $backend "http://app:8000";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # V14.2.5 / V14.3.2 — prevent caching of authenticated API responses
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }
}
