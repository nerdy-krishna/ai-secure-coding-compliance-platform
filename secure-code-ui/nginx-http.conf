server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.0/8;

    if ($request_method = TRACE) {
        return 405;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Allow Let's Encrypt to verify domain ownership
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Deny VCS metadata directories (V13.4.1)
    location ~ /\.(git|svn|hg|bzr) {
        deny all;
        return 404;
    }

    # Deny sensitive file extensions (V13.2.5)
    location ~* \.(env|ini|conf|key|pem|sql|bak|swp|log)$ {
        return 404;
    }

    # Deny monitoring/diagnostic paths (V13.4.5)
    location = /metrics {
        return 404;
    }

    # The Vite build emits content-hashed JS/CSS bundles plus a single
    # index.html that always references the latest hashes. If
    # index.html is cached by the browser, the user keeps loading the
    # OLD bundle even after a redeploy — the symptom is "I rebuilt but
    # I see the old page until I hard-refresh." Force every navigation
    # request to validate against the server. Hashed assets stay
    # cacheable a year (their content is immutable by hash).
    location = / {
        limit_req zone=spa_zone burst=200 nodelay;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /index.html {
        limit_req zone=spa_zone burst=200 nodelay;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hashed JS/CSS/etc. — immutable by content; cache aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform" always;
    }

    # Serve the React application fallback (SPA route handling).
    # The default cache headers fall through here; client-router URLs
    # like /analysis/results/abc are mapped back to index.html which
    # has its own cache header above.
    location / {
        limit_req zone=spa_zone burst=200 nodelay;
        try_files $uri $uri/ /index.html;
    }

    resolver 127.0.0.11 valid=30s;

    # Grafana lives under /grafana/ on this same host and certificate (no second
    # hostname, no port 3000 exposure). `^~` is required so the asset regex
    # above cannot hijack Grafana's own /grafana/public/*.js bundles, and the
    # upstream is a variable so nginx starts (and the SPA keeps serving) even
    # when the log_stack profile is not running.
    #
    # The split below is deliberate: `proxy_buffering off` on the whole prefix
    # made nginx dribble Grafana's ~3.3 MB of assets out in small chunks and the
    # login page never finished loading over a high-latency link. Static,
    # content-hashed bundles are buffered, gzipped and cached; only the Live
    # streaming endpoints stay unbuffered.
    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/public/ {
        set $grafana_static "http://grafana:3000";
        proxy_pass $grafana_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;

        # Cache headers: Grafana already sends `public, max-age=31536000` for
        # its content-hashed bundles. Do not add a second Cache-Control here -
        # overriding it made the browser re-download everything on every
        # navigation.
    }

    location ^~ /grafana/api/live/ {
        set $grafana_live "http://grafana:3000";
        proxy_pass $grafana_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /grafana/ {
        set $grafana "http://grafana:3000";
        proxy_pass $grafana;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Dashboard queries can outlast the default 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Grafana responses are user-specific; never let an intermediary cache.
        add_header Cache-Control "no-store" always;
    }

    # Proxy API requests to backend
    location /api/v1/ {
        limit_req zone=api_zone burst=60 nodelay;

        # Resolve `app` per-request via Docker's embedded DNS (the
        # `resolver` directive above) so a recreated backend container
        # with a new IP is followed automatically. A static `upstream {}`
        # block or a literal proxy_pass host caches the IP at nginx
        # startup and 502s once the backend is recreated. Mirrors
        # nginx-https.conf.
        set $backend "http://app:8000";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts (V13.1.3)
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream_timeout 0;
        proxy_next_upstream_tries 1;

        # Anti-caching for authenticated API responses (V14.2.5, V14.3.2)
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }
}
