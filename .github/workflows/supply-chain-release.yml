name: Signed supply-chain release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Public keyless or private KMS-backed Cosign signing
        type: choice
        options: [public_keyless, private_kms]
        default: public_keyless
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-attest:
    name: ${{ matrix.target }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/sccap-${{ matrix.target }}
      SIGNING_MODE: ${{ inputs.signing_mode || 'public_keyless' }}
      COSIGN_KMS_URI: ${{ secrets.COSIGN_KMS_URI }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.SUPPLY_CHAIN_AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.SUPPLY_CHAIN_AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.SUPPLY_CHAIN_AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Pin reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62  # v3.10.0
      - name: Authenticate registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish with BuildKit attestations
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
      - name: Load the exact pushed image digest for local inspection
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE@$IMAGE_DIGEST"
      - name: Generate CycloneDX from the exact image digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: raw-${{ matrix.target }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind image scanner evidence and create truthful provenance
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python scripts/generate_release_sbom.py \
            --input "raw-${{ matrix.target }}.cdx.json" \
            --image "$IMAGE" \
            --digest "$IMAGE_DIGEST" \
            --target "${{ matrix.target }}" \
            --revision "${{ github.sha }}" \
            --output "sccap-${{ matrix.target }}.cdx.json"
          python scripts/generate_slsa_provenance.py \
            --image "$IMAGE" \
            --digest "$IMAGE_DIGEST" \
            --revision "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --workflow-ref "${{ github.workflow_ref }}" \
            --target "${{ matrix.target }}" \
            --invocation-id "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --output "sccap-${{ matrix.target }}.slsa.json"
      - name: Require private KMS configuration
        if: env.SIGNING_MODE == 'private_kms'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_TO_ASSUME"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCOUNT_ID"
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$COSIGN_KMS_URI" == awskms://* ]]
      - name: Assume private signing role with GitHub OIDC
        if: env.SIGNING_MODE == 'private_kms'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: sccap-cosign-${{ github.run_id }}-${{ github.run_attempt }}
          audience: sts.amazonaws.com
          unset-current-credentials: true
      - name: Sign image (public keyless)
        if: env.SIGNING_MODE == 'public_keyless'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
      - name: Sign image (private KMS)
        if: env.SIGNING_MODE == 'private_kms'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key "$COSIGN_KMS_URI" "$IMAGE@$IMAGE_DIGEST"
      - name: Attach public keyless attestations
        if: env.SIGNING_MODE == 'public_keyless'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate "sccap-${{ matrix.target }}.cdx.json" "$IMAGE@$IMAGE_DIGEST"
          cosign attest --yes --type slsaprovenance \
            --predicate "sccap-${{ matrix.target }}.slsa.json" "$IMAGE@$IMAGE_DIGEST"
      - name: Attach private KMS attestations
        if: env.SIGNING_MODE == 'private_kms'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --key "$COSIGN_KMS_URI" --type cyclonedx \
            --predicate "sccap-${{ matrix.target }}.cdx.json" "$IMAGE@$IMAGE_DIGEST"
          cosign attest --yes --key "$COSIGN_KMS_URI" --type slsaprovenance \
            --predicate "sccap-${{ matrix.target }}.slsa.json" "$IMAGE@$IMAGE_DIGEST"
      - name: Upload auditable predicates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: supply-chain-${{ matrix.target }}
          path: |
            sccap-${{ matrix.target }}.cdx.json
            sccap-${{ matrix.target }}.slsa.json
          retention-days: 35
