name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_provider:
        description: Run the one-call, cost-bounded live OpenAI evaluation
        required: true
        type: boolean
        default: false
      live_provider_model:
        description: OpenAI model id for the opt-in evaluation
        required: true
        type: string
        default: gpt-4o-mini

# Cancel superseded runs on the same ref so PRs don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-backend:
    name: Backend lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install lint tools
        # Only install the tools we need — skip the full poetry dep tree
        # (torch + transformers would take multiple minutes and aren't
        # needed for linting the source).
        run: pip install "ruff==0.11.11" "black==25.1.0"
      - name: ruff
        run: ruff check src tests
      - name: black --check
        run: black --check src tests

  lint-frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-code-ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: secure-code-ui/package-lock.json
      - name: Install deps
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vite build
        run: npm run build
      - name: Deterministic bundle budgets
        run: npm run check:bundle

  poetry-lock-check:
    name: poetry.lock drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install "poetry==1.8.3"
      - name: Verify lock file is in sync
        # `poetry check --lock` fails if the committed lock doesn't match
        # pyproject.toml. Previously the Dockerfile regenerated the lock
        # at build time, which papered over drift; this job now catches
        # it at PR time.
        run: poetry check --lock

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit==1.7.9"
      - name: bandit
        run: bandit -r src -ll

  pip-audit:
    name: pip-audit (dependency CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry + pip-audit
        run: pip install "poetry==1.8.3" "pip-audit==2.7.3"
      - name: Export dependency requirements
        run: poetry export --without-hashes --format=requirements.txt --output=requirements-audit.txt
      - name: pip-audit
        run: pip-audit --strict --requirement requirements-audit.txt

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

