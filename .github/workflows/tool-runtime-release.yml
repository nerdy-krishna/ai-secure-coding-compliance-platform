name: Tool-runtime images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tool-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: tool runtime images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [python, nmap, nuclei, zap, playwright, relay]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/sccap-tool-${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Authenticate registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: runtimes/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          build-args: |
            NUCLEI_VERSION=3.3.8
            NUCLEI_SHA256=1526650021ada87e9cfc2a30048c8e59f5db9eed079c7807d53b7e181009bfe4
            ZAP_VERSION=2.16.0
            ZAP_SHA256=a0779509e702ec53d41074eaa0ce41f2a964a822aa5be0380255a482e2e7fe8d
            PLAYWRIGHT_VERSION=1.52.0
      - name: Print digest
        run: |
          echo "== ${{ matrix.target }} =="
          docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}'
