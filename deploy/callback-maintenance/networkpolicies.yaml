apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: c11-maintenance-default-deny
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [c11-reconciler, c11-expiry, c11-retention-deleter, c11-retention-verifier]}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: c11-maintenance-postgres-only
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [c11-reconciler, c11-expiry, c11-retention-deleter, c11-retention-verifier]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {sccap.io/c11-data-plane: "approved"}}
          podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: c11-evidence-workers-fixed-store-and-kms-only
spec:
  podSelector: {matchLabels: {sccap.io/c11-evidence-access: "true"}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 10.77.0.3/32}}]
      ports: [{port: 9000, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.77.0.4/32}}]
      ports: [{port: 443, protocol: TCP}]
