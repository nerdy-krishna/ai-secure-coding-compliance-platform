# SCCAP API, worker and UI for the kind deployment.
# Secrets come from the `sccap-env` Secret rendered from the local .env, so the
# cluster speaks the same credentials as the Compose install.
apiVersion: v1
kind: Service
metadata:
  # The UI's nginx reverse-proxies /api/v1 to http://app:8000, so the API
  # Service keeps the Compose service name.
  name: app
  namespace: sccap
spec:
  selector: {app: sccap-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: sccap-api-node
  namespace: sccap
spec:
  type: NodePort
  selector: {app: sccap-api}
  ports:
    - {port: 8000, targetPort: 8000, nodePort: 30081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sccap
spec:
  replicas: 1
  selector:
    matchLabels: {app: sccap-api}
  template:
    metadata:
      labels: {app: sccap-api}
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: api
          image: sccap/api:kind
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: sccap-env}
          command: ["sh", "-c"]
          args:
            - "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /api/v1/setup/status, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/v1/setup/status, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "2", memory: 3Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sccap
spec:
  replicas: 1
  selector:
    matchLabels: {app: sccap-worker}
  template:
    metadata:
      labels: {app: sccap-worker}
    spec:
      containers:
        - name: worker
          image: sccap/worker:kind
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: sccap-env}
          command: ["python", "-m", "app.workers.consumer"]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "4", memory: 6Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: sccap
spec:
  type: NodePort
  selector: {app: sccap-ui}
  ports:
    - {port: 80, targetPort: 80, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: sccap
spec:
  replicas: 1
  selector:
    matchLabels: {app: sccap-ui}
  template:
    metadata:
      labels: {app: sccap-ui}
    spec:
      containers:
        - name: ui
          image: sccap/ui:kind
          imagePullPolicy: IfNotPresent
          env:
            - {name: SSL_ENABLED, value: "false"}
            # HTTP-only is an explicit opt-in; the entrypoint refuses otherwise.
            - {name: SSL_DEV_INSECURE, value: "true"}
            # nginx resolves the proxy target without DNS search domains, so the
            # Kubernetes deployment needs the fully-qualified service names.
            - {name: BACKEND_HOST, value: "app.sccap.svc.cluster.local"}
            - {name: GRAFANA_HOST, value: "grafana.sccap.svc.cluster.local"}
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
