# kind cluster for a local SCCAP deployment.
#
#   kind create cluster --name sccap --config deploy/kind/kind-config.yaml
#
# The UI is published on http://localhost:8080 and the API directly on
# http://localhost:8001 — both are NodePorts on the single control-plane node,
# so nothing depends on a cloud load balancer being present.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sccap
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30081
        hostPort: 8001
        protocol: TCP
