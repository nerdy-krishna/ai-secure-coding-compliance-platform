apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sccap.fullname" . }}-api
  labels:
    {{- include "sccap.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "sccap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/runtime: {{ printf "%s:%s" .Values.runtime.apiSecret .Values.runtime.existingConfigMap | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sccap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sccap.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        {{- include "sccap.spread" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "sccap.apiImage" . }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["uvicorn", "app.infrastructure.observability.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            {{- include "sccap.envFrom" (dict "root" . "secret" .Values.runtime.apiSecret) | nindent 12 }}
          env:
            - {name: OTEL_ENABLED, value: {{ .Values.otel.enabled | quote }}}
            - {name: OTEL_SERVICE_NAME, value: sccap-api}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://{{ include "sccap.fullname" . }}-otel:4318"}
          ports: [{name: http, containerPort: 8000, protocol: TCP}]
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
          securityContext:
            {{- include "sccap.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sccap.fullname" . }}-api
  labels:
    {{- include "sccap.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "sccap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sccap.fullname" . }}-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "sccap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
