{{- if and .Values.autoscaling.keda.enabled .Values.workerPools.splitEnabled }}
{{- $root := . -}}
{{- $pools := dict "scanner" .Values.workerPools.scanner "llm" .Values.workerPools.llm "report" .Values.workerPools.report -}}
{{- range $name, $pool := $pools }}
{{- if $pool.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sccap.fullname" $root }}-worker-{{ $name }}
  labels:
    {{- include "sccap.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "sccap.fullname" $root }}-worker-{{ $name }}
  pollingInterval: {{ $root.Values.autoscaling.keda.pollingInterval }}
  cooldownPeriod: {{ $root.Values.autoscaling.keda.cooldownPeriod }}
  minReplicaCount: {{ $pool.minReplicas }}
  maxReplicaCount: {{ $pool.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $root.Values.autoscaling.keda.scaleDownStabilizationSeconds }}
          policies:
            - {type: Percent, value: 25, periodSeconds: 60}
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Percent, value: 100, periodSeconds: 15}
            - {type: Pods, value: 4, periodSeconds: 15}
          selectPolicy: Max
  triggers:
    - type: rabbitmq
      metadata:
        protocol: auto
        mode: QueueLength
        queueName: {{ $pool.queue | quote }}
        value: {{ $pool.backlogTarget | quote }}
        hostFromEnv: RABBITMQ_URL
    - type: prometheus
      metadata:
        serverAddress: {{ $root.Values.autoscaling.keda.rabbitmqPrometheusAddress | quote }}
        metricName: {{ printf "sccap_%s_oldest_message_age_seconds" $name | quote }}
        threshold: {{ $pool.oldestAgeTargetSeconds | quote }}
        query: >-
          clamp_min(time() - (max(rabbitmq_detailed_queue_head_message_timestamp{queue="{{ $pool.queue }}"}) or vector(time())), 0)
---
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.autoscaling.keda.enabled .Values.pentestVerification.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sccap.fullname" . }}-pentest-verification
  labels:
    {{- include "sccap.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "sccap.fullname" . }}-pentest-verification
  pollingInterval: {{ .Values.autoscaling.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.keda.cooldownPeriod }}
  minReplicaCount: 1
  maxReplicaCount: 1
  triggers:
    - type: rabbitmq
      metadata:
        protocol: auto
        mode: QueueLength
        queueName: {{ .Values.pentestVerification.queue | quote }}
        value: "1"
        hostFromEnv: RABBITMQ_PENTEST_VERIFICATION_URL
{{- end }}
{{- if and .Values.autoscaling.keda.enabled .Values.pentestController.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sccap.fullname" . }}-pentest-controller
  labels:
    {{- include "sccap.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "sccap.fullname" . }}-pentest-controller
  pollingInterval: {{ .Values.autoscaling.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.keda.cooldownPeriod }}
  minReplicaCount: 1
  maxReplicaCount: 4
  triggers:
    - type: rabbitmq
      metadata:
        protocol: auto
        mode: QueueLength
        queueName: {{ .Values.pentestController.queue | quote }}
        value: "1"
        hostFromEnv: RABBITMQ_PENTEST_CONTROLLER_URL
{{- end }}
{{- if and .Values.autoscaling.keda.enabled .Values.pentestToolPack.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sccap.fullname" . }}-pentest-tool-worker
  labels:
    {{- include "sccap.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "sccap.fullname" . }}-pentest-tool-worker
  pollingInterval: {{ .Values.autoscaling.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.pentestToolPack.minReplicas }}
  maxReplicaCount: {{ .Values.pentestToolPack.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.keda.scaleDownStabilizationSeconds }}
          policies: [{type: Percent, value: 25, periodSeconds: 60}]
  triggers:
    - type: rabbitmq
      metadata:
        protocol: auto
        mode: QueueLength
        queueName: {{ .Values.pentestToolPack.queue | quote }}
        value: {{ .Values.pentestToolPack.backlogTarget | quote }}
        hostFromEnv: PENTEST_TOOL_WORKER_RABBIT_URL
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.keda.rabbitmqPrometheusAddress | quote }}
        metricName: sccap_pentest_tool_oldest_message_age_seconds
        threshold: {{ .Values.pentestToolPack.oldestAgeTargetSeconds | quote }}
        query: >-
          clamp_min(time() - (max(rabbitmq_detailed_queue_head_message_timestamp{queue="{{ .Values.pentestToolPack.queue }}"}) or vector(time())), 0)
{{- end }}
