apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sccap.fullname" . }}-test-api
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: connect
      image: curlimages/curl:8.15.0
      args: ["--fail", "--silent", "--show-error", "--max-time", "5", "http://{{ include "sccap.fullname" . }}-api:{{ .Values.api.service.port }}/docs"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
